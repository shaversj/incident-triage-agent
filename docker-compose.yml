services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incident_triage
      POSTGRES_USER: incident_triage
      POSTGRES_PASSWORD: incident_triage
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_triage -d incident_triage"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - incident-triage-postgres:/var/lib/postgresql/data

volumes:
  incident-triage-postgres:
